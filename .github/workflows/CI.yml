name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt huggingface_hub
      - name: Download model files from Hugging Face Hub
        env:
          LOS_HF_Token: ${{ secrets.LOS_HF_Token }}
        run: python scripts/download_models.py
      - run: python -m pytest tests/ -q
