name: CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".scratch/**"
      - ".hf-sha"
  workflow_dispatch:
  schedule:
    - cron: "0 3 1 * *"
  repository_dispatch:
    types: [hf-model-updated]

permissions:
  contents: write
  packages: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  check-hf:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q huggingface_hub
      - id: check
        env:
          LOS_HF_Token: ${{ secrets.LOS_HF_Token }}
        run: |
          SHA=$(python -c "import os; from huggingface_hub import HfApi; print(HfApi(token=os.environ.get('LOS_HF_Token') or None).repo_info('Ajiboye/ny2017hospital_predict_model', repo_type='model').sha)")
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          OLD=$(cat .hf-sha 2>/dev/null || true)
          if [ "$SHA" != "$OLD" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi

  release:
    needs: check-hf
    if: github.event_name != 'schedule' || needs.check-hf.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prep names
        run: |
          echo "IMAGE=${{ env.REGISTRY }}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APP_VERSION=${{ github.sha }}
            LOS_HF_Token=${{ secrets.LOS_HF_Token }}

      - name: Smoke test published image
        run: |
          docker run -d --name los-smoke -p 8000:8000 \
            ${{ env.IMAGE }}:sha-${{ env.SHORT_SHA }}
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/api/health | grep -q '"model_loaded": *true'; then
              echo "smoke OK"; docker stop los-smoke; exit 0
            fi
            sleep 5
          done
          echo "smoke FAILED"; docker logs los-smoke; docker stop los-smoke; exit 1

      - name: Trigger Render deploy hook
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

      - name: Record HF model revision
        run: |
          echo "${{ needs.check-hf.outputs.sha }}" > .hf-sha
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .hf-sha
          git diff --cached --quiet && echo "sha unchanged" && exit 0
          git commit -m "chore: record HF model revision [skip ci]"
          git push
